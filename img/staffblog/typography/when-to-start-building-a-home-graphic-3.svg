<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="1200" height="486" role="img"><title>迷っていることを、相談の入り口に</title><rect width="1200" height="486" fill="#fff"/><g font-family="YuMincho, Yu Mincho, Hiragino Mincho ProN, Noto Serif CJK JP, serif" fill="#373833"><text x="60" y="55" font-size="19" letter-spacing="4" fill="#887359">家づくりの視点</text><path d="M60 78H1140" stroke="#dfe1db"/><text x="60" y="156" font-size="64" letter-spacing="1">迷っていることを、相談の入り口に</text><text x="60" y="268" font-size="21" fill="#887359" letter-spacing="3">01</text><path d="M60 289h322" stroke="#dfe1db"/><text x="60" y="354" font-size="42">希望を整理</text><text x="391" y="354" font-size="29" fill="#887359">→</text><text x="420" y="268" font-size="21" fill="#887359" letter-spacing="3">02</text><path d="M420 289h322" stroke="#dfe1db"/><text x="420" y="354" font-size="42">条件を整理</text><text x="751" y="354" font-size="29" fill="#887359">→</text><text x="780" y="268" font-size="21" fill="#887359" letter-spacing="3">03</text><path d="M780 289h322" stroke="#dfe1db"/><text x="780" y="354" font-size="42">相談して確認</text></g></svg>