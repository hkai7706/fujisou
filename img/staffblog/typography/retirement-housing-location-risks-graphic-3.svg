<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img"><title>住まいの安心は、周囲との関係も含めて</title><rect width="1200" height="564" fill="#fff"/><g font-family="YuMincho, Yu Mincho, Hiragino Mincho ProN, Noto Serif CJK JP, serif" fill="#373833"><text x="60" y="55" font-size="19" letter-spacing="4" fill="#887359">家づくりの視点</text><path d="M60 78H1140" stroke="#dfe1db"/><text x="60" y="156" font-size="64" letter-spacing="1">住まいの安心は、周</text><text x="60" y="234" font-size="64" letter-spacing="1">囲との関係も含めて</text><text x="60" y="346" font-size="21" fill="#887359" letter-spacing="3">01</text><path d="M60 367h322" stroke="#dfe1db"/><text x="60" y="432" font-size="42">地域との接点</text><text x="420" y="346" font-size="21" fill="#887359" letter-spacing="3">02</text><path d="M420 367h322" stroke="#dfe1db"/><text x="420" y="432" font-size="42">生活する場所</text><text x="780" y="346" font-size="21" fill="#887359" letter-spacing="3">03</text><path d="M780 367h322" stroke="#dfe1db"/><text x="780" y="432" font-size="42">費用の備え</text></g></svg>