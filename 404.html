<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません｜フジ創アイノス</title>
  <style>
    :root { color-scheme: light; font-family: YuMincho, "Yu Mincho", "Hiragino Mincho ProN", serif; color: #493b31; background: #f7f7f5; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100svh; margin: 0; place-items: center; padding: 32px; }
    main { width: min(680px, 100%); padding: clamp(44px, 8vw, 88px); border-top: 3px solid #806039; background: #fff; box-shadow: 0 20px 70px rgb(73 59 49 / 8%); text-align: center; }
    p:first-child { margin: 0 0 18px; color: #967042; font: 500 13px/1.5 Georgia, serif; letter-spacing: .2em; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); font-weight: 400; letter-spacing: .05em; }
    main > p:not(:first-child) { margin: 24px auto 36px; color: #71665f; line-height: 2; }
    a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 26px; border: 1px solid #967042; color: #493b31; text-decoration: none; }
    a:hover { color: #fff; background: #806039; }
    a:focus-visible { outline: 2px solid #967042; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>404 / PAGE NOT FOUND</p>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。<br>トップページから、もう一度お探しください。</p>
    <a href="/">トップページへ戻る</a>
  </main>
</body>
</html>
