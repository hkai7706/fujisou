<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 564" width="1200" height="564" role="img"><title>数字で分かることと、現場で分かること</title><rect width="1200" height="564" fill="#fff"/><g font-family="YuMincho, Yu Mincho, Hiragino Mincho ProN, Noto Serif CJK JP, serif" fill="#373833"><text x="60" y="55" font-size="19" letter-spacing="4" fill="#887359">家づくりの視点</text><path d="M60 78H1140" stroke="#dfe1db"/><text x="60" y="156" font-size="64" letter-spacing="1">数字で分かることと</text><text x="60" y="234" font-size="64" letter-spacing="1">、現場で分かること</text><text x="60" y="346" font-size="21" fill="#887359" letter-spacing="3">01</text><path d="M60 367h502" stroke="#dfe1db"/><text x="60" y="432" font-size="42">資料で確認</text><text x="600" y="346" font-size="21" fill="#887359" letter-spacing="3">02</text><path d="M600 367h502" stroke="#dfe1db"/><text x="600" y="432" font-size="42">現場と人を確認</text></g></svg>